<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <title>Phàm Nhân Tu Tiên - Offline Reader</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<header class="topbar">
  <div class="topbar-inner">

    <div class="brand">
      <strong>Phàm Nhân Tu Tiên</strong>
      <small id="statusText">Đang tải…</small>
    </div>

    <button id="themeBtn" type="button">☀ Light</button>
    <button id="fontDown" type="button">A−</button>
    <button id="fontUp" type="button">A+</button>

  </div>
</header>

<main class="page">

  <section class="controls card">

    <div class="row">

      <label>
        Phần
        <select id="partSelect"></select>
      </label>

      <div class="chapter-field">
        <label for="chapterInput">Chương</label>

        <div class="chapter-input-row">
          <input
            id="chapterInput"
            type="number"
            min="1"
            inputmode="numeric"
            autocomplete="off"
          >
          <button id="goBtn" type="button">Đi</button>
        </div>
      </div>

    </div>

    <label class="toc">
      Danh sách chương
      <select id="chapterSelect">
        <option>Đang tải mục lục...</option>
      </select>
    </label>

    <div class="nav-row">
      <button id="prevBtn" type="button">← Chương trước</button>
      <button id="nextBtn" type="button">Chương tiếp →</button>
    </div>

    <div class="offline-row">
      <button id="offlineBtn" class="secondary" type="button">
        Tải phần này để đọc offline
      </button>
      <span id="offlineStatus"></span>
    </div>

  </section>

  <article class="reader card">
    <h1 id="chapterTitle">Đang tải…</h1>
    <div id="chapterContent" class="chapter-content"></div>
  </article>

  <section class="bottom-nav">
    <button id="prevBtnBottom" type="button">← Trước</button>
    <button id="topBtn" class="secondary" type="button">↑ Đầu chương</button>
    <button id="nextBtnBottom" type="button">Tiếp →</button>
  </section>

</main>

<script src="./app.js"></script>

</body>
</html>
